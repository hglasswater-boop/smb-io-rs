[workspace]
resolver = "2"
members = [
    "crates/smb-wire",
    "crates/smb-auth",
    "crates/smb-client",
    "crates/smb-fs",
    "crates/smb-stream",
    "crates/smb-android",
    "crates/smb-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hglasswater-boop/smb-io-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
