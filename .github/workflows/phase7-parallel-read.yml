name: Phase 7 Parallel READ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parallel-read:
    name: Live credit-driven parallel READ
    runs-on: ubuntu-latest
    env:
      SMB_PORT: '1445'
      SMB_USER: smbtest
      SMB_PASSWORD: smbtest-ci-password
      FIXTURE_SIZE: '33554432'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Samba
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba
          sudo systemctl stop smbd nmbd 2>/dev/null || true
          sudo pkill smbd 2>/dev/null || true

      - name: Create fixture
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin "$SMB_USER" 2>/dev/null || true
          printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | sudo smbpasswd -s -a "$SMB_USER"
          sudo rm -rf /tmp/smb-phase7-read
          sudo mkdir -p /tmp/smb-phase7-read
          python3 - <<'PY'
          size = 32 * 1024 * 1024
          pattern = bytes(((i * 31 + 7) % 251) for i in range(251))
          data = (pattern * ((size + len(pattern) - 1) // len(pattern)))[:size]
          with open('/tmp/parallel.bin', 'wb') as handle:
              handle.write(data)
          PY
          sudo mv /tmp/parallel.bin /tmp/smb-phase7-read/parallel.bin
          sudo chown -R "$SMB_USER":"$SMB_USER" /tmp/smb-phase7-read
          sudo chmod -R a+rX /tmp/smb-phase7-read

      - name: Start Samba
        run: |
          cat > /tmp/smb-phase7.conf <<EOF
          [global]
            server role = standalone server
            workgroup = WORKGROUP
            security = user
            map to guest = Never
            server min protocol = SMB2_10
            server max protocol = SMB3_11
            server signing = mandatory
            smb ports = ${SMB_PORT}
            interfaces = 127.0.0.1
            bind interfaces only = yes
            disable netbios = yes
            log file = /tmp/smb-phase7.log

          [auth]
            path = /tmp/smb-phase7-read
            read only = yes
            guest ok = no
            valid users = ${SMB_USER}
          EOF
          sudo smbd -D -s /tmp/smb-phase7.conf
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/${SMB_PORT}) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify parallel READ
        run: |
          set -o pipefail
          cargo run -p smb-io-probe --example parallel_read -- \
            127.0.0.1 "$SMB_PORT" auth parallel.bin "$SMB_USER" "$SMB_PASSWORD" "$FIXTURE_SIZE" \
            2>&1 | tee /tmp/phase7-parallel-read.log
          grep -q '^parallel_read_content_verified: true$' /tmp/phase7-parallel-read.log
          grep -q '^parallel_read_overlap_verified: true$' /tmp/phase7-parallel-read.log

      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat /tmp/phase7-parallel-read.log 2>/dev/null || true
          sudo cat /tmp/smb-phase7.log 2>/dev/null || true
