name: Live Adaptive Probe Once

on:
  push:
    branches:
      - test/live-adaptive-read-ahead
    paths:
      - '.github/workflows/live-adaptive-probe-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-adaptive-read-ahead
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply live adaptive probe patch
        run: python3 tools/add_live_adaptive_probe.py
      - name: Format
        run: cargo fmt --all
      - name: Validate workspace
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p smb-io-stream
      - name: Commit integration workflow update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/smb-probe/examples/adaptive_read_ahead.rs .github/workflows/samba-integration.yml
          git diff --cached --quiet || git commit -m "test(stream): exercise adaptive read-ahead on Samba"
          git push
