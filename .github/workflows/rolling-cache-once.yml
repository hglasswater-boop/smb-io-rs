name: Rolling Cache Once

on:
  push:
    branches:
      - feature/rolling-video-cache
    paths:
      - '.github/workflows/rolling-cache-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rolling-video-cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply rolling-cache patch
        run: python3 tools/rolling_cache_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Validate stream and Android bridge
        run: |
          cargo test -p smb-io-stream
          cargo check -p smb-io-android
          cargo clippy -p smb-io-stream -p smb-io-android -- -D warnings
      - name: Commit implementation
        run: |
          rm tools/rolling_cache_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(stream): roll and auto-refill video cache"
          git push
