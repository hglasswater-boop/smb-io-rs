name: Foreground Pipeline Wave Once

on:
  push:
    branches:
      - feature/foreground-pipeline-wave
    paths:
      - '.github/workflows/foreground-pipeline-wave-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foreground-pipeline-wave
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply foreground pipeline-wave patch
        run: python3 tools/foreground_pipeline_wave.py
      - name: Format
        run: cargo fmt --all
      - name: Validate stream and Android bridge
        run: |
          cargo test -p smb-io-stream
          cargo check -p smb-io-android
          cargo clippy -p smb-io-stream -p smb-io-android -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/smb-stream/src/video.rs
          git diff --cached --quiet && exit 1
          git commit -m "perf(stream): bound foreground miss to one pipeline wave"
          git push
