name: Format Once

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prefetch-cache-extension
    paths:
      - '.github/workflows/format-once.yml'
      - 'crates/**/*.rs'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/prefetch-cache-extension
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: apply rustfmt"
          git push
