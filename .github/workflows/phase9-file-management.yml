name: Phase 9 File Management Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-management:
    name: Live MKDIR RENAME DELETE
    runs-on: ubuntu-latest
    env:
      SMB_PORT: '1445'
      SMB_USER: smbtest
      SMB_PASSWORD: smbtest-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Samba
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba
          sudo systemctl stop smbd nmbd 2>/dev/null || true
          sudo pkill smbd 2>/dev/null || true

      - name: Create writable share
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin "$SMB_USER" 2>/dev/null || true
          printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | sudo smbpasswd -s -a "$SMB_USER"
          sudo rm -rf /tmp/smb-phase9
          sudo mkdir -p /tmp/smb-phase9
          sudo chown -R "$SMB_USER":"$SMB_USER" /tmp/smb-phase9
          sudo chmod 700 /tmp/smb-phase9

      - name: Start Samba
        run: |
          cat > /tmp/smb-phase9.conf <<EOF
          [global]
            server role = standalone server
            workgroup = WORKGROUP
            security = user
            map to guest = Never
            server min protocol = SMB2_10
            server max protocol = SMB3_11
            server signing = mandatory
            smb ports = ${SMB_PORT}
            interfaces = 127.0.0.1
            bind interfaces only = yes
            disable netbios = yes
            log file = /tmp/smb-phase9.log

          [auth]
            path = /tmp/smb-phase9
            read only = no
            guest ok = no
            valid users = ${SMB_USER}
            create mask = 0600
            directory mask = 0700
          EOF
          sudo smbd -D -s /tmp/smb-phase9.conf
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/${SMB_PORT}) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify Phase 9 file management
        run: |
          set -o pipefail
          cargo run -p smb-io-probe --example file_management -- \
            127.0.0.1 "$SMB_PORT" auth phase9 "$SMB_USER" "$SMB_PASSWORD" \
            2>&1 | tee /tmp/phase9.log
          grep -q '^mkdir_verified: true$' /tmp/phase9.log
          grep -q '^unicode_rename_verified: true$' /tmp/phase9.log
          grep -q '^collision_verified: true$' /tmp/phase9.log
          grep -q '^replace_existing_verified: true$' /tmp/phase9.log
          grep -q '^file_delete_verified: true$' /tmp/phase9.log
          grep -q '^nonempty_directory_guard_verified: true$' /tmp/phase9.log
          grep -q '^directory_delete_verified: true$' /tmp/phase9.log
          grep -q '^phase9_verified: true$' /tmp/phase9.log

      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat /tmp/phase9.log 2>/dev/null || true
          sudo cat /tmp/smb-phase9.log 2>/dev/null || true
          sudo find /tmp/smb-phase9 -maxdepth 4 -printf '%y %p\n' 2>/dev/null || true
