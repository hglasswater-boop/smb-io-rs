name: Fix Rolling Cache Patch

on:
  push:
    branches:
      - feature/rolling-video-cache
    paths:
      - '.github/workflows/rolling-cache-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rolling-video-cache
      - name: Fix guarded marker indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rolling-cache-once.yml')
          lines = path.read_text().splitlines(keepends=True)

          send_blocks = 0
          dispatch_blocks = 0
          i = 0
          while i < len(lines):
              if "'''            .send(InteractiveCommand::Read {" in lines[i]:
                  send_blocks += 1
                  j = i + 1
                  while j < len(lines) and "'''" not in lines[j]:
                      if 'generation,' in lines[j] or 'offset,' in lines[j] or 'prefetch_generation,' in lines[j]:
                          lines[j] = '    ' + lines[j]
                      j += 1
                  i = j
              elif "'''                SelectedCommand::Interactive(Some(InteractiveCommand::Read {" in lines[i]:
                  dispatch_blocks += 1
                  j = i + 1
                  while j < len(lines) and "'''" not in lines[j]:
                      if lines[j].strip():
                          lines[j] = '        ' + lines[j]
                      j += 1
                  i = j
              i += 1

          if send_blocks != 2:
              raise SystemExit(f'expected 2 send marker blocks, got {send_blocks}')
          if dispatch_blocks != 2:
              raise SystemExit(f'expected 2 dispatch marker blocks, got {dispatch_blocks}')

          path.write_text(''.join(lines))
          PY
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/rolling-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: fix rolling cache patch markers"
          git push
