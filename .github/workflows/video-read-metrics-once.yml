name: Video Read Metrics Once

on:
  push:
    branches:
      - feature/video-read-metrics
    paths:
      - '.github/workflows/video-read-metrics-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-read-metrics
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply video-read metrics patch
        run: python3 tools/video_read_metrics.py
      - name: Format
        run: cargo fmt --all
      - name: Validate stream and Android bridge
        run: |
          cargo test -p smb-io-stream
          cargo check -p smb-io-android
          cargo clippy -p smb-io-stream -p smb-io-android -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/smb-stream/src/video.rs crates/smb-stream/src/lib.rs
          git diff --cached --quiet && exit 1
          git commit -m "feat(stream): add video read workload metrics"
          git push
