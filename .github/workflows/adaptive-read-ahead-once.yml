name: Adaptive Read Ahead Once

on:
  push:
    branches:
      - feature/adaptive-read-ahead
    paths:
      - '.github/workflows/adaptive-read-ahead-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-read-ahead
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply adaptive read-ahead patch
        run: python3 tools/adaptive_read_ahead.py
      - name: Format
        run: cargo fmt --all
      - name: Validate workspace consumers
        run: |
          cargo test -p smb-io-stream
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/smb-stream/src/video.rs
          git diff --cached --quiet && exit 1
          git commit -m "feat(stream): adapt read-ahead to observed throughput"
          git push
