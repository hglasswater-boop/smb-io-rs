name: Phase 8 WRITE Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  write-roundtrip:
    name: Live CREATE WRITE READ CLOSE
    runs-on: ubuntu-latest
    env:
      SMB_PORT: '1445'
      SMB_USER: smbtest
      SMB_PASSWORD: smbtest-ci-password
      WRITE_SIZE: '8388608'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Samba
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba
          sudo systemctl stop smbd nmbd 2>/dev/null || true
          sudo pkill smbd 2>/dev/null || true

      - name: Create writable share
        run: |
          sudo useradd --no-create-home --shell /usr/sbin/nologin "$SMB_USER" 2>/dev/null || true
          printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | sudo smbpasswd -s -a "$SMB_USER"
          sudo rm -rf /tmp/smb-phase8-write
          sudo mkdir -p /tmp/smb-phase8-write
          sudo chown -R "$SMB_USER":"$SMB_USER" /tmp/smb-phase8-write
          sudo chmod 700 /tmp/smb-phase8-write

      - name: Start Samba
        run: |
          cat > /tmp/smb-phase8.conf <<EOF
          [global]
            server role = standalone server
            workgroup = WORKGROUP
            security = user
            map to guest = Never
            server min protocol = SMB2_10
            server max protocol = SMB3_11
            server signing = mandatory
            smb ports = ${SMB_PORT}
            interfaces = 127.0.0.1
            bind interfaces only = yes
            disable netbios = yes
            log file = /tmp/smb-phase8.log

          [auth]
            path = /tmp/smb-phase8-write
            read only = no
            guest ok = no
            valid users = ${SMB_USER}
            create mask = 0600
            directory mask = 0700
          EOF
          sudo smbd -D -s /tmp/smb-phase8.conf
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/${SMB_PORT}) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Verify WRITE round trip
        run: |
          set -o pipefail
          cargo run -p smb-io-probe --example write_roundtrip -- \
            127.0.0.1 "$SMB_PORT" auth phase8.bin "$SMB_USER" "$SMB_PASSWORD" "$WRITE_SIZE" \
            2>&1 | tee /tmp/phase8-write.log
          grep -q '^write_create_verified: true$' /tmp/phase8-write.log
          grep -q '^write_existing_verified: true$' /tmp/phase8-write.log
          grep -q '^write_large_verified: true$' /tmp/phase8-write.log
          grep -q '^write_positional_verified: true$' /tmp/phase8-write.log
          grep -q '^write_roundtrip_verified: true$' /tmp/phase8-write.log

      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat /tmp/phase8-write.log 2>/dev/null || true
          sudo cat /tmp/smb-phase8.log 2>/dev/null || true
          sudo ls -l /tmp/smb-phase8-write 2>/dev/null || true
